[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0", "numpy"]
build-backend = "scikit_build_core.build"


[project]
name = "dapps"
dynamic = ["version"]
description = "A library for creating and connecting dApps to Open RAN units."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["dApps", "O-RAN", "5G", "cellular", "networks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
# NOTE: E3AP transport is provided by libe3's Python bindings (`libe3py`),
# which are not on PyPI. Install them into this environment with:
#   cd ~/libe3 && ./build_libe3 --install --enable-swig \
#     --cmake-opt "-DLIBE3_ENABLE_ASN1=ON -DLIBE3_ENABLE_JSON=ON"
# (asn1tools is still required for the in-Python service-model codecs.)
dependencies = [
    "asn1tools",
    "typing_extensions",
    "numpy",
    "sigmf",
    "jsonschema>=4.18.0",
    # protobuf E3SM codec path (spectrum/simple SMs); >=4.21 for FieldDescriptor
    # .has_presence and the current generated-code format.
    "protobuf>=4.21",
]

authors = [
    {name = "Andrea Lacava", email = "thecave003@gmail.com"},
]


[project.urls]
Homepage = "https://openrangym.com/o-ran-frameworks/dapps"
Package = "https://pypi.org/project/dapps/"
Source = "https://github.com/wineslab/dApp-library"
"Bug Tracker" = "https://github.com/wineslab/dApp-library/issues"


[project.optional-dependencies]
api = ["influxdb_client"]
cnn = ["libiq"]
gui = ["flask", "flask-sock", "flask-cors", "matplotlib", "pyzmq"]
network = ["pysctp"]
all = [
    "pysctp",
    "flask",
    "flask-sock",
    "flask-cors",
    "matplotlib",
    "pyzmq",
    "influxdb_client",
    "libiq",
]


[tool.scikit-build]
cmake.version = ">=3.16"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

# Pure-Python packages laid out under src/. scikit-build-core copies these
# into the wheel; CMake then drops the SWIG outputs into iq_saver/ next to
# the Python facade.
wheel.packages = [
    "src/dapp",
    "src/e3interface",
    "src/spectrum",
    "src/nvidia",
    "src/simple",
    "src/iq_saver",
    "src/visualization",
    # Ship the runnable examples so they can be launched from the installed
    # wheel via `python -m examples.<name>` (e.g. the OAI rfsim CI driving the
    # real spectrum dApp) instead of a hand-rolled launcher.
    "examples",
]

# Include the libiqsaver C++ tree and the root CMake in the sdist so
# users can build wheels from a published source tarball.
sdist.include = [
    "VERSION",
    "CMakeLists.txt",
    "libiqsaver/**",
]


[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^(?P<value>\\d+\\.\\d+\\.\\d+)"
