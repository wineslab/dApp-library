name: Run tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.repository != 'wineslab/dApp-library'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake swig nlohmann-json3-dev

      - name: Install package (editable, with test deps)
        run: pip install -e ".[all]" pytest

      - name: Run tests
        run: pytest tests/ -v
