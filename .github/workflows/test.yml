name: Run tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.repository != 'wineslab/dApp-library'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake swig nlohmann-json3-dev libzmq3-dev libprotobuf-dev protobuf-compiler

      # libe3py (a dependency) is built against an installed libe3 of the same version, so the
      # job pins libe3py to the libe3 it installs instead of taking the newest release.
      - name: Install libe3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(python3 -c "import re; print(re.search(r'libe3py>=([0-9.]+)', open('pyproject.toml').read()).group(1))")
          echo "LIBE3_VER=$ver" >> "$GITHUB_ENV"
          gh release download "$ver" --repo wineslab/libe3 --pattern "libe3_${ver}_amd64.deb" --dir "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/libe3_${ver}_amd64.deb"

      - name: Install package (editable, with test deps)
        run: pip install -e ".[all]" pytest "libe3py==${LIBE3_VER}"

      - name: Run tests
        run: pytest tests/ -v
